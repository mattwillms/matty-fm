# OrrFM console: four channels mixed on the Logitech USB card, each with its own volume.
pcm.orr_dmix {
    type dmix
    ipc_key 4242
    ipc_perm 0666
    slave {
        pcm "hw:CARD=X,DEV=0"
        rate 44100
        channels 2
        period_size 1024
        buffer_size 8192
    }
}
pcm.soma  { type softvol slave.pcm "orr_dmix" control { name "SomaVol"  card X } min_dB -60.0 max_dB 0.0 }
pcm.deckA { type softvol slave.pcm "orr_dmix" control { name "DeckAVol" card X } min_dB -60.0 max_dB 0.0 }
pcm.deckB { type softvol slave.pcm "orr_dmix" control { name "DeckBVol" card X } min_dB -60.0 max_dB 0.0 }
pcm.dj    { type softvol slave.pcm "orr_dmix" control { name "DjVol"    card X } min_dB -60.0 max_dB 0.0 }
