# MattyFM console: five channels mixed on the Logitech USB card, each with its own volume.
pcm.orr_dmix {
    type dmix
    ipc_key 4242
    ipc_perm 0666
    slave {
        pcm "hw:CARD=X,DEV=0"
        rate 44100
        channels 2
        period_size 1024
        buffer_size 8192
    }
}
pcm.soma  { type softvol slave.pcm "orr_dmix" control { name "SomaVol"  card X } min_dB -60.0 max_dB 0.0 }
pcm.deckA { type softvol slave.pcm "orr_dmix" control { name "DeckAVol" card X } min_dB -60.0 max_dB 0.0 }
pcm.deckB { type softvol slave.pcm "orr_dmix" control { name "DeckBVol" card X } min_dB -60.0 max_dB 0.0 }
pcm.dj    { type softvol slave.pcm "orr_dmix" control { name "DjVol"    card X } min_dB -60.0 max_dB 0.0 }
pcm.fx    { type softvol slave.pcm "orr_dmix" control { name "FxVol"    card X } min_dB -60.0 max_dB 0.0 }

# The listening tap (TAP=1 in /etc/mattyfm.conf, and the snd-aloop module loaded): the same five channels,
# each written to the speakers' mix above AND to a second mix on the loopback card, which pi/tap.py reads
# for a listener elsewhere on the network. The console uses these only while /proc/asound/Loopback exists.
pcm.tap_dmix {
    type dmix
    ipc_key 4343
    ipc_perm 0666
    slave { pcm "hw:CARD=Loopback,DEV=0,SUBDEV=0" format S16_LE rate 44100 channels 2 period_size 1024 buffer_size 8192 }
}
pcm.orr_both {
    type plug
    slave.pcm {
        type route
        slave.pcm {
            type multi
            slaves.a { pcm "orr_dmix" channels 2 }
            slaves.b { pcm "tap_dmix" channels 2 }
            bindings.0 { slave a channel 0 }
            bindings.1 { slave a channel 1 }
            bindings.2 { slave b channel 0 }
            bindings.3 { slave b channel 1 }
        }
        ttable.0.0 1
        ttable.1.1 1
        ttable.0.2 1
        ttable.1.3 1
    }
}
pcm.soma_t  { type softvol slave.pcm "orr_both" control { name "SomaVol"  card X } min_dB -60.0 max_dB 0.0 }
pcm.deckA_t { type softvol slave.pcm "orr_both" control { name "DeckAVol" card X } min_dB -60.0 max_dB 0.0 }
pcm.deckB_t { type softvol slave.pcm "orr_both" control { name "DeckBVol" card X } min_dB -60.0 max_dB 0.0 }
pcm.dj_t    { type softvol slave.pcm "orr_both" control { name "DjVol"    card X } min_dB -60.0 max_dB 0.0 }
pcm.fx_t    { type softvol slave.pcm "orr_both" control { name "FxVol"    card X } min_dB -60.0 max_dB 0.0 }
