# MattyFM: two players mixed on the Logitech USB card, each with its own volume.
pcm.mattyfm_dmix {
    type dmix
    ipc_key 4242
    ipc_perm 0666
    slave {
        pcm "hw:CARD=X,DEV=0"
        rate 44100
        channels 2
        period_size 1024
        buffer_size 8192
    }
}
pcm.soma {
    type softvol
    slave.pcm "mattyfm_dmix"
    control { name "SomaVol" card X }
    min_dB -60.0
    max_dB 0.0
}
pcm.station {
    type softvol
    slave.pcm "mattyfm_dmix"
    control { name "StationVol" card X }
    min_dB -60.0
    max_dB 0.0
}
